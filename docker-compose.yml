# Starts PostgreSQL, the API and the web client.
#   docker compose up --build
#   App:  http://localhost:8080
# Seed demo data (after the stack is up):
#   docker compose exec server node src/db/seed.js

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: sweety
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d sweety"]
      interval: 3s
      timeout: 3s
      retries: 10

  server:
    build: ./server
    environment:
      PORT: 5000
      DATABASE_URL: postgres://postgres:postgres@db:5432/sweety
      JWT_SECRET: ${JWT_SECRET:-docker-dev-secret-change-me}
      APP_TIMEZONE: ${APP_TIMEZONE:-Asia/Kolkata}
      CLIENT_ORIGIN: http://localhost:8080
    ports:
      - "5000:5000"
    depends_on:
      db:
        condition: service_healthy

  client:
    build: ./client
    ports:
      - "8080:80"
    depends_on:
      - server

volumes:
  pgdata:
